version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fs_enrs}
      POSTGRES_USER: ${DB_USER:-enrs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-enrs_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-enrs} -d ${DB_NAME:-fs_enrs}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - enrs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - enrs
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4100:4100"
    volumes:
      - uploads:/app/uploads
      # Mount FreeSWITCH filesystem directories from the host.
      # Set FS_SOUND_DIR, FS_SCRIPT_DIR, FS_DIALPLAN_DIR, FS_RECORDING_DIR
      # in backend/.env to match these mount points.
      # Example (uncomment and adjust to your host paths):
      # - /opt/freeswitch/share/freeswitch/sounds:/opt/freeswitch/share/freeswitch/sounds
      # - /opt/freeswitch/etc/freeswitch/scripts:/opt/freeswitch/etc/freeswitch/scripts
      # - /opt/freeswitch/etc/freeswitch/dialplan:/opt/freeswitch/etc/freeswitch/dialplan
      # - /opt/freeswitch/var/lib/freeswitch/recordings:/opt/freeswitch/var/lib/freeswitch/recordings
    networks:
      - enrs
    restart: unless-stopped

  piper:
    build:
      context: ./services/piper
    environment:
      PIPER_MODEL_DIR: /app/models
      PIPER_DEFAULT_VOICE: en_US-lessac-medium
      PIPER_SAMPLE_RATE: 8000
      PIPER_MAX_CONCURRENT: 2
      PIPER_SYNTHESIS_TIMEOUT_SEC: 30
      PIPER_MAX_TEXT_LENGTH: 5000
      LOG_LEVEL: INFO
    volumes:
      # Mount voice model files from host.
      # Adjust this path to wherever the .onnx + .onnx.json files live.
      - /opt/freeswitch-ui/enrs-tools/voices:/app/models:ro
    expose:
      - "5000"
    # Port 5000 is internal only — NOT published to the host.
    # Only the backend container can reach it via the 'enrs' Docker network.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - enrs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "8100:8100"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - enrs
    restart: unless-stopped

volumes:
  pgdata:
  uploads:

networks:
  enrs:
    driver: bridge
